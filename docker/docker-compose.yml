# StrictRAG 本地依赖
# 规格：prds/02-engineering · prds/10-delivery · Sprint0 检查单
#
# 默认可运行栈（PG + Redis + ES + Mongo + S3 兼容）：
#   docker compose -f docker/docker-compose.yml up -d
#
# 业务进程 api/worker 仍用本地 pnpm dev（不在 compose 内）。
# 打开 http/s3 见 docs/ops/operable-stack.md；CI 默认仍 mock。

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: strict_rag
      POSTGRES_PASSWORD: strict_rag
      POSTGRES_DB: strict_rag
    ports:
      - "5432:5432"
    volumes:
      - strict_rag_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strict_rag -d strict_rag"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Elasticsearch 8（可运行 BM25；IK 生产镜像另换，本窗不装插件）
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - strict_rag_es:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # MongoDB：parse 正文权威（worker 有 URL 才写）
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - strict_rag_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  # S3 兼容（ADR-012：生产 RustFS；本地 MinIO dogfood，服务名仍 rustfs）
  # 桶由 api STORAGE_MODE=s3 首次 put/ensureReady 创建，不另跑 mc
  rustfs:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: strict_rag
      MINIO_ROOT_PASSWORD: strict_rag_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - strict_rag_rustfs:/data

volumes:
  strict_rag_pg:
  strict_rag_es:
  strict_rag_mongo:
  strict_rag_rustfs:
